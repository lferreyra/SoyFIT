    <script>
      (function() {
        // If window.fetch was previously defined as a getter-only accessor, clean it up
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (desc && desc.get && !desc.set) {
            delete window.fetch;
          }
        } catch (e) {}

        // Global suppressor for third-party Chrome extensions and fetch setter errors
        var isExtensionOrFetchError = function(msg, file, err) {
          var m = (msg || '') + '';
          var f = (file || '') + '';
          var s = (err && err.stack ? err.stack : '') + '';
          var em = (err && err.message ? err.message : '') + '';
          return f.indexOf('chrome-extension://') !== -1 ||
                 s.indexOf('chrome-extension://') !== -1 ||
                 m.indexOf('chrome-extension://') !== -1 ||
                 m.indexOf('Cannot set property fetch') !== -1 ||
                 em.indexOf('Cannot set property fetch') !== -1 ||
                 s.indexOf('Cannot set property fetch') !== -1 ||
                 m.indexOf('fetch of #<Window>') !== -1 ||
                 em.indexOf('fetch of #<Window>') !== -1 ||
                 s.indexOf('fetch of #<Window>') !== -1;
        };

        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (isExtensionOrFetchError(msg, url, error)) {
            return true;
          }
        };

        window.addEventListener('error', function(event) {
          if (!event) return;
          var msg = (event.message || '') + '';
          var file = (event.filename || '') + '';
          var err = event.error;
          if (isExtensionOrFetchError(msg, file, err)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          var reason = event.reason;
          var msg = (reason && reason.message ? reason.message : reason) + '';
          var stack = (reason && reason.stack ? reason.stack : '') + '';
          if (isExtensionOrFetchError(msg, '', reason) || stack.indexOf('chrome-extension://') !== -1) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
